                            return { handled: true, response: MemorySystem.query('lihat memory') };

                        case 'knowledge':
                            UI.openModal('knowledge');
                            return { handled: true, response: 'Membuka panel Basis Pengetahuan.' };

                        case 'learn':
                            UI.openModal('learning');
                            return { handled: true, response: 'Membuka Learning Center.' };

                        case 'notes':
                            UI.openModal('notes');
                            return { handled: true, response: 'Membuka Catatan.' };

                        case 'files':
                            UI.openModal('files');
                            return { handled: true, response: 'Membuka Berkas.' };

                        case 'projects':
                            UI.openModal('projects');
                            return { handled: true, response: 'Membuka Workspace Proyek.' };

                        case 'tools':
                            UI.openModal('tools');
                            return { handled: true, response: 'Membuka Tool Manager.' };

                        case 'clear':
                            ChatEngine.clearActiveMessages();
                            return { handled: true, response: 'Riwayat percakapan sesi ini telah dibersihkan.' };

                        case 'reset':
                            if (confirm('Reset seluruh data V7 ke pengaturan awal?')) {
                                localStorage.clear();
                                location.reload();
                            }
                            return { handled: true, response: 'Reset dibatalkan.' };

                        case 'export':
                        case 'import':
                            UI.openModal('backup');
                            return { handled: true, response: 'Membuka panel Backup & Restore.' };

                        case 'about':
                            UI.openModal('about');
                            return { handled: true, response: 'Membuka informasi tentang AI Agent V7.' };

                        default:
                            return { handled: true, response: `Perintah \`/${cmd}\` tidak dikenali. Ketik \`/help\` untuk melihat daftar perintah.` };
                    }
                }
            };

            /* =========================================================
               N. AGENT CORE ORCHESTRATION PIPELINE
               ========================================================= */
            const Agent = {
                async process(userQuery) {
                    const start = performance.now();
                    const trimmed = userQuery.trim();

                    // 1. Task Planner Multi-Step
                    const taskPlan = TaskPlanner.decompose(trimmed);
                    if (taskPlan) {
                        return {
                            text: `Tugas multi-langkah berhasil dideteksi dan diproses secara otonom:`,
                            taskPlan,
                            telemetry: { intent: 'TASK_PLANNER', confidence: 1.0, latency: Math.round(performance.now() - start) }
                        };
                    }

                    // 2. Command Processor (/...)
                    const cmdRes = Commands.run(trimmed);
                    if (cmdRes) {
                        return {
                            text: cmdRes.response,
                            telemetry: { intent: 'COMMAND', confidence: 1.0, latency: Math.round(performance.now() - start) }
                        };
                    }

                    // 3. Self-Learning Syntax (ajari | intent | teks)
                    if (trimmed.toLowerCase().startsWith('ajari |')) {
                        const parts = trimmed.split('|').map(p => p.trim());
                        if (parts.length >= 3) {
                            const newIntent = parts[1].toLowerCase();
                            const sampleText = parts[2];
                            State.training.push({
                                id: 'trn_' + Date.now(),
                                intent: newIntent,
                                text: sampleText,
                                confidence: 0.95,
                                usage: 0
                            });
                            Sync.training();
                            return {
                                text: `Terima kasih! Saya telah mempelajari bahwa kalimat *"${sampleText}"* adalah intent **${newIntent}**.`,
                                telemetry: { intent: 'INTENT_TRAINER', confidence: 1.0, latency: Math.round(performance.now() - start) }
                            };
                        }
                    }

                    // 4. Memory Save Entity
                    const memStored = MemorySystem.extractAndStore(trimmed);
                    if (memStored) {
                        return {
                            text: `Baik, saya telah menyimpan ${memStored}.`,
                            telemetry: { intent: 'MEMORY_STORE', confidence: 0.99, latency: Math.round(performance.now() - start) }
                        };
                    }

                    // 5. Memory Query
                    const memQueried = MemorySystem.query(trimmed);
                    if (memQueried) {
                        return {
                            text: memQueried,
                            telemetry: { intent: 'MEMORY_QUERY', confidence: 0.95, latency: Math.round(performance.now() - start) }
                        };
                    }

                    // 6. Unit Converter
                    const convRes = ConverterEngine.parse(trimmed);
                    if (convRes) {
                        return {
                            text: `📊 **Hasil Konversi:**\n${convRes}`,
                            telemetry: { intent: 'UNIT_CONVERTER', confidence: 0.99, latency: Math.round(performance.now() - start) }
                        };
                    }

                    // 7. Safe Calculator
                    const mathQuery = trimmed.replace(/^(hitung|kalkulasi|berapa|hitunglah)\s+/i, '');
                    const calcRes = SafeCalculator.solve(mathQuery);
                    if (calcRes !== null) {
                        return {
                            text: `Hasil perhitungan: **${calcRes.toLocaleString('id-ID')}**`,
                            telemetry: { intent: 'CALCULATOR', confidence: 0.99, latency: Math.round(performance.now() - start) }
                        };
                    }

                    // 8. Date & Time
                    const dtRes = DateTimeEngine.match(trimmed);
                    if (dtRes) {
                        return {
                            text: dtRes,
                            telemetry: { intent: 'DATETIME', confidence: 0.99, latency: Math.round(performance.now() - start) }
                        };
                    }

                    // 9. Knowledge Base Lookup
                    const kbRes = KnowledgeSystem.match(trimmed);
                    if (kbRes) {
                        return {
                            text: kbRes.answer,
                            telemetry: { intent: 'KNOWLEDGE_BASE', confidence: kbRes.score, latency: Math.round(performance.now() - start) }
                        };
                    }

                    // 10. NLP Machine Learning Classification
                    const pred = NLPEngine.predictIntent(trimmed);
                    if (pred.confidence >= State.settings.confidenceThreshold) {
                        let responseText = '';
                        switch (pred.intent) {
                            case 'salam': responseText = `Halo! Ada yang bisa saya bantu di project ini?`; break;
                            case 'kabar': responseText = `Semua sistem V7 berfungsi optimal dan siap menjalankan tugas Anda.`; break;
                            case 'terimakasih': responseText = `Sama-sama! Senang dapat membantu Anda.`; break;
                            case 'perpisahan': responseText = `Sampai jumpa! Hubungi saya kembali kapan pun diperlukan.`; break;
                            case 'identitas_ai': responseText = `Saya adalah **${State.settings.aiName}**, asisten otonom V7 berbasis JavaScript vanilla murni.`; break;
                            case 'kemampuan': responseText = `Kemampuan V7: Chat cerdas, task planner, multi-project, calculator matematika, konverter satuan, memory manager, notes, file assistant, dan Google Search fallback.`; break;
                            case 'bantuan': responseText = `Ketik pertanyaan apa saja, coba kalkulator \`/calc\`, atau buka command palette \`Ctrl+K\`.`; break;
                        }

                        if (responseText) {
                            return {
                                text: responseText,
                                telemetry: { intent: pred.intent, confidence: pred.confidence, latency: Math.round(performance.now() - start) }
                            };
                        }
                    }

                    // 11. GOOGLE SEARCH FALLBACK (STRICT)
                    if (State.settings.autoGoogleSearch) {
                        if (navigator.onLine) {
                            bukaGoogle(trimmed);
                            return {
                                text: `Saya belum menemukan jawaban yang cukup dari pengetahuan lokal saya. Saya membuka Google untuk membantu mencari informasi.`,
                                isSearch: true,
                                query: trimmed,
                                telemetry: { intent: 'GOOGLE_FALLBACK', confidence: pred.confidence, latency: Math.round(performance.now() - start) }
                            };
                        } else {
                            return {
                                text: `Anda sedang offline. Google Search tidak dapat dibuka saat ini.`,
                                isSearch: false,
                                telemetry: { intent: 'OFFLINE_FALLBACK', confidence: 0, latency: Math.round(performance.now() - start) }
                            };
                        }
                    }

                    return {
                        text: `Saya belum menemukan jawaban lokal. Latih saya dengan \`ajari | intent | ${trimmed}\` atau simpan fakta dengan \`ingat | ${trimmed} | jawaban\`.`,
                        telemetry: { intent: 'LOW_CONFIDENCE', confidence: pred.confidence, latency: Math.round(performance.now() - start) }
                    };
                },

                async handleInput(raw) {
                    if (State.isGenerating) return;
                    const clean = raw.trim();
                    if (!clean) return;

                    ChatEngine.ensureSession();
                    ChatEngine.addMessage('user', clean);
                    UI.clearInput();

                    State.isGenerating = true;
                    UI.showTyping(true);

                    try {
                        const result = await this.process(clean);
                        UI.showTyping(false);
                        ChatEngine.addMessage('ai', result.text, result.isSearch ? result.query : null, result.taskPlan, result.telemetry);
                        Speech.speak(result.text);
                    } catch (e) {
                        State.lastErrorLog = e.message;
                        UI.showTyping(false);
                        ChatEngine.addMessage('ai', 'Terjadi kesalahan sistem saat memproses pesan.');
                    } finally {
                        State.isGenerating = false;
                    }
                }
            };

            /* =========================================================
               O. CHAT SESSION MANAGER
               ========================================================= */
            const ChatEngine = {
                ensureSession() {
                    if (!State.activeChatId || !State.chats.find(c => c.id === State.activeChatId)) {
                        this.createSession('Percakapan Baru');
                    }
                },

                createSession(title = 'Percakapan Baru') {
                    const id = 'chat_' + Date.now();
                    const session = {
                        id,
                        projectId: State.activeProjectId,
                        title,
                        createdAt: Date.now(),
                        messages: [],
                        isPinned: false,
                        isFavorite: false
                    };
                    State.chats.unshift(session);
                    State.activeChatId = id;
                    Sync.chats();
                    Sync.activeChat();
                    UI.renderSidebar();
                    UI.renderMessages();
                    return session;
                },

                getActiveSession() {
                    return State.chats.find(c => c.id === State.activeChatId) || null;
                },

                addMessage(role, content, searchQuery = null, taskPlan = null, telemetry = null) {
                    const session = this.getActiveSession();
                    if (!session) return;

                    const msg = {
                        id: 'msg_' + Date.now() + Math.random().toString(36).substr(2, 4),
                        role,
                        content,
                        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                        searchQuery,
                        taskPlan,
                        telemetry
                    };

                    session.messages.push(msg);

                    if (role === 'user' && session.messages.length <= 2 && session.title === 'Percakapan Baru') {
                        session.title = content.length > 24 ? content.slice(0, 24) + '...' : content;
                        UI.updateHeaderTitle(session.title);
                    }

                    Sync.chats();
                    UI.appendMessageElement(msg);
                    UI.renderSidebar();
                },

                deleteSession(id) {
                    State.chats = State.chats.filter(c => c.id !== id);
                    if (State.activeChatId === id) {
                        State.activeChatId = State.chats.length > 0 ? State.chats[0].id : null;
                        Sync.activeChat();
                    }
                    Sync.chats();
                    UI.renderSidebar();
                    UI.renderMessages();
                },

                renameSession(id, newTitle) {
                    const s = State.chats.find(c => c.id === id);
                    if (s && newTitle.trim()) {
                        s.title = newTitle.trim();
                        Sync.chats();
                        UI.renderSidebar();
                        if (State.activeChatId === id) UI.updateHeaderTitle(s.title);
                    }
                },

                clearActiveMessages() {
                    const s = this.getActiveSession();
                    if (s) {
                        s.messages = [];
                        Sync.chats();
                        UI.renderMessages();
                    }
                }
            };

            /* =========================================================
               P. UI CONTROLLER & MARKDOWN SANITIZED PARSER
               ========================================================= */
            const UI = {
                init() {
                    this.applyTheme(State.settings.theme);
                    this.applyFontScale(State.settings.fontScale);
                    this.updateOnlineStatus(navigator.onLine);
                    Speech.init();

                    if (State.chats.length === 0) {
                        ChatEngine.createSession('Percakapan Baru');
                    } else if (!State.activeChatId) {
                        State.activeChatId = State.chats[0].id;
                    }

                    this.renderSidebar();
                    this.renderMessages();
                    this.bindEvents();
                    PWAEngine.init();
                },

                applyTheme(theme) {
                    if (theme === 'system') {
                        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
                    } else {
                        document.documentElement.setAttribute('data-theme', theme);
                    }
                    State.settings.theme = theme;
                    Sync.settings();
                },

                applyFontScale(scale) {
                    document.documentElement.setAttribute('data-font', scale);
                    State.settings.fontScale = scale;
                    Sync.settings();
                },

                updateOnlineStatus(isOnline) {
                    const dot = document.getElementById('onlineStatusDot');
                    if (dot) {
                        dot.classList.toggle('offline', !isOnline);
                        dot.title = isOnline ? 'Online (Semua Layanan Aktif)' : 'Offline (Mode Lokal Aktif)';
                    }
                },

                toast(msg, type = 'info') {
                    const shelf = document.getElementById('toastShelf');
                    if (!shelf) return;
                    const t = document.createElement('div');
                    t.className = 'toast-pill';
                    if (type === 'danger') t.style.borderLeftColor = 'var(--danger)';
                    if (type === 'success') t.style.borderLeftColor = 'var(--success)';
                    if (type === 'warning') t.style.borderLeftColor = 'var(--warning)';
                    t.textContent = msg;
                    shelf.appendChild(t);
                    setTimeout(() => t.remove(), 3400);
                },

                updateHeaderTitle(t) {
                    const el = document.getElementById('activeSessionTitle');
                    if (el) el.textContent = t;
                },

                clearInput() {
                    const inp = document.getElementById('userChatInput');
                    if (inp) {
                        inp.value = '';
                        inp.style.height = 'auto';
                    }
                },

                updateSpeechButton(isListening) {
                    const btn = document.getElementById('btnVoiceInput');
                    const indicator = document.getElementById('speechStatusIndicator');
                    if (btn) btn.classList.toggle('listening', isListening);
                    if (indicator) indicator.textContent = isListening ? '🔴 Mendengarkan suara...' : '';
                },

                showTyping(show) {
                    const container = document.getElementById('chatMessageViewport');
                    if (!container) return;
                    const existing = document.getElementById('activeTypingIndicator');
                    if (existing) existing.remove();

                    if (show) {
                        const row = document.createElement('div');
                        row.className = 'chat-row ai';
                        row.id = 'activeTypingIndicator';
                        row.innerHTML = `
                            <div class="typing-bubble">
                                <div class="typing-dot"></div>
                                <div class="typing-dot"></div>
                                <div class="typing-dot"></div>
                            </div>
                        `;
                        container.appendChild(row);
                        container.scrollTop = container.scrollHeight;
                    }
                },

                parseMarkdown(rawText) {
                    // Escape raw HTML first
                    let text = String(rawText)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');

                    // Code Blocks with Viewer
                    text = text.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (match, lang, codeContent) => {
                        const cleanLang = lang || 'code';
                        return `
                            <div class="code-viewer-card">
                                <div class="code-viewer-header">
                                    <span>${cleanLang.toUpperCase()}</span>
                                    <div class="code-viewer-actions">
                                        <button class="btn-code-action" data-copy-code="${encodeURIComponent(codeContent)}">📋 Salin</button>
                                        <button class="btn-code-action" data-download-code="${encodeURIComponent(codeContent)}" data-lang="${cleanLang}">💾 Unduh</button>
                                    </div>
                                </div>
                                <pre><code>${codeContent}</code></pre>
                            </div>
                        `;
                    });

                    // Inline Code
                    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
                    // Headings
                    text = text.replace(/^### (.*$)/gim, '<h3>$1</h3>');
                    text = text.replace(/^## (.*$)/gim, '<h2>$1</h2>');
                    text = text.replace(/^# (.*$)/gim, '<h1>$1</h1>');
                    // Bold & Italic
                    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                    text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                    // Blockquotes
                    text = text.replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>');
                    // Lists
                    text = text.replace(/^\• (.*$)/gim, '<li>$1</li>');
                    text = text.replace(/^\- (.*$)/gim, '<li>$1</li>');
                    // Linebreaks
                    text = text.replace(/\n/g, '<br>');

                    return text;
                },

                appendMessageElement(msg) {
                    const container = document.getElementById('chatMessageViewport');
                    if (!container) return;

                    const hero = container.querySelector('.hero-welcome-card');
                    if (hero) hero.remove();

                    const row = document.createElement('div');
                    row.className = `chat-row ${msg.role}`;

                    const meta = document.createElement('div');
                    meta.className = 'chat-meta';
                    meta.innerHTML = `<span>${msg.role === 'user' ? (State.settings.userName || 'Anda') : State.settings.aiName}</span><span>•</span><span>${msg.time}</span>`;
                    row.appendChild(meta);

                    const bubble = document.createElement('div');
                    bubble.className = 'chat-bubble';
                    bubble.innerHTML = this.parseMarkdown(msg.content);

                    // Task Planner step display
                    if (msg.taskPlan && Array.isArray(msg.taskPlan)) {
                        const planBox = document.createElement('div');
                        planBox.className = 'task-plan-box';
                        planBox.innerHTML = `
                            <div class="task-plan-header">
                                <span>📋 RENCANA TUGAS OTONOM</span>
                                <span>SELESAI</span>
                            </div>
                        `;
                        msg.taskPlan.forEach(step => {
                            const stepEl = document.createElement('div');
                            stepEl.className = 'task-step-item completed';
                            stepEl.innerHTML = `<span>✓</span><span><b>Langkah ${step.id}:</b> ${step.desc}</span>`;
                            planBox.appendChild(stepEl);
                        });
                        bubble.appendChild(planBox);
                    }

                    if (msg.role === 'ai') {
                        const toolsBar = document.createElement('div');
                        toolsBar.className = 'bubble-tools-bar';

                        const copyBtn = document.createElement('button');
                        copyBtn.className = 'btn-bubble-tool';
                        copyBtn.textContent = '📋 Salin';
                        copyBtn.addEventListener('click', () => {
                            navigator.clipboard.writeText(msg.content).then(() => UI.toast('Teks berhasil disalin!', 'success'));
                        });

                        const speakBtn = document.createElement('button');
                        speakBtn.className = 'btn-bubble-tool';
                        speakBtn.textContent = '🔊 Dengar';
                        speakBtn.addEventListener('click', () => Speech.speak(msg.content));

                        toolsBar.appendChild(copyBtn);
                        toolsBar.appendChild(speakBtn);

                        if (msg.searchQuery) {
                            const googleBtn = document.createElement('button');
                            googleBtn.className = 'google-search-pill';
                            googleBtn.textContent = '🔍 Buka di Google';
                            googleBtn.addEventListener('click', () => bukaGoogle(msg.searchQuery));
                            toolsBar.appendChild(googleBtn);
                        }

                        bubble.appendChild(toolsBar);
                    }

                    row.appendChild(bubble);
                    container.appendChild(row);

                    // Attach code actions
                    bubble.querySelectorAll('[data-copy-code]').forEach(b => {
                        b.addEventListener('click', (e) => {
                            const code = decodeURIComponent(e.target.getAttribute('data-copy-code'));
                            navigator.clipboard.writeText(code).then(() => UI.toast('Kode disalin!', 'success'));
                        });
                    });

                    bubble.querySelectorAll('[data-download-code]').forEach(b => {
                        b.addEventListener('click', (e) => {
                            const code = decodeURIComponent(e.target.getAttribute('data-download-code'));
                            const lang = e.target.getAttribute('data-lang') || 'txt';
                            const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `code_${Date.now()}.${lang}`;
                            a.click();
                            URL.revokeObjectURL(url);
                        });
                    });

                    if (State.settings.autoScroll) container.scrollTop = container.scrollHeight;
                },

                renderMessages() {
                    const container = document.getElementById('chatMessageViewport');
                    if (!container) return;
                    container.innerHTML = '';

                    const s = ChatEngine.getActiveSession();
                    if (!s || s.messages.length === 0) {
                        this.updateHeaderTitle('Percakapan Baru');
                        container.innerHTML = `
                            <div class="hero-welcome-card">
                                <h2>Halo 👋</h2>
                                <p>Saya AI Agent V7 Ultimate. Siap membantu percakapan cerdas, task planner, memori entitas, kalkulator matematika, pengelola berkas, dan pencarian Google.</p>
                                <div class="quick-actions-grid">
                                    <div class="action-card-btn" data-act="apa itu fotosintesis">
                                        <div class="card-btn-head">🌱 Pengetahuan</div>
                                        <div class="card-btn-sub">Apa itu fotosintesis?</div>
                                    </div>
                                    <div class="action-card-btn" data-act="nama saya Nicholas">
                                        <div class="card-btn-head">🧠 Simpan Memori</div>
                                        <div class="card-btn-sub">Nama saya Nicholas</div>
                                    </div>
                                    <div class="action-card-btn" data-act="/calc sin(30) + sqrt(144) * 2">
                                        <div class="card-btn-head">🧮 Safe Calculator</div>
                                        <div class="card-btn-sub">sin(30) + sqrt(144) * 2</div>
                                    </div>
                                    <div class="action-card-btn" data-act="10 km ke meter">
                                        <div class="card-btn-head">🔄 Konverter Satuan</div>
                                        <div class="card-btn-sub">10 km ke meter</div>
                                    </div>
                                    <div class="action-card-btn" data-act="jam berapa sekarang">
                                        <div class="card-btn-head">🕒 Waktu & Tanggal</div>
                                        <div class="card-btn-sub">Jam berapa sekarang?</div>
                                    </div>
                                    <div class="action-card-btn" data-act="/help">
                                        <div class="card-btn-head">📖 Panduan Lengkap</div>
                                        <div class="card-btn-sub">Daftar perintah /help</div>
                                    </div>
                                </div>
                            </div>
                        `;

                        container.querySelectorAll('.action-card-btn').forEach(card => {
                            card.addEventListener('click', () => {
                                const prompt = card.getAttribute('data-act');
                                if (prompt) Agent.handleInput(prompt);
                            });
                        });
                        return;
                    }

                    this.updateHeaderTitle(s.title);
                    s.messages.forEach(m => this.appendMessageElement(m));
                },

                renderSidebar() {
                    const list = document.getElementById('sidebarDynamicList');
                    if (!list) return;
                    list.innerHTML = '';

                    const p = State.projects.find(pr => pr.id === State.activeProjectId);
                    const projLabel = document.getElementById('currentProjectLabel');
                    if (projLabel) projLabel.textContent = `📁 ${p ? p.name : 'Project'}`;

                    if (State.activeSidebarTab === 'chats') {
                        const projChats = State.chats.filter(c => c.projectId === State.activeProjectId);
                        if (projChats.length === 0) {
                            list.innerHTML = '<div style="color:var(--text-dim); text-align:center; padding:16px;">Belum ada riwayat chat di project ini.</div>';
                            return;
                        }

                        projChats.forEach(session => {
                            const item = document.createElement('div');
                            item.className = `chat-nav-item ${session.id === State.activeChatId ? 'active' : ''}`;

                            const title = document.createElement('div');
                            title.className = 'chat-nav-title';
                            title.textContent = session.title;

                            const actions = document.createElement('div');
                            actions.className = 'chat-nav-actions';

                            const btnEdit = document.createElement('button');
                            btnEdit.className = 'btn-icon-sm';
                            btnEdit.textContent = '✏️';
                            btnEdit.title = 'Ganti Nama';
                            btnEdit.addEventListener('click', (e) => {
                                e.stopPropagation();
                                const newT = prompt('Nama percakapan:', session.title);
                                if (newT) ChatEngine.renameSession(session.id, newT);
                            });

                            const btnDel = document.createElement('button');
                            btnDel.className = 'btn-icon-sm danger-hover';
                            btnDel.textContent = '🗑️';
                            btnDel.title = 'Hapus';
                            btnDel.addEventListener('click', (e) => {
                                e.stopPropagation();
                                if (confirm(`Hapus chat "${session.title}"?`)) ChatEngine.deleteSession(session.id);
                            });

                            actions.appendChild(btnEdit);
                            actions.appendChild(btnDel);

                            item.appendChild(title);
                            item.appendChild(actions);

                            item.addEventListener('click', () => {
                                State.activeChatId = session.id;
                                Sync.activeChat();
                                UI.renderSidebar();
                                UI.renderMessages();
                                UI.closeSidebarDrawer();
                            });

                            list.appendChild(item);

                        { label: '📚 Tambah Pengetahuan (Knowledge Base)', action: () => UI.openModal('knowledge') },
                        { label: '📁 Buat / Beralih Project', action: () => UI.openModal('projects') },
                        { label: '📝 Buka Catatan (Notes)', action: () => UI.openModal('notes') },
                        { label: '📄 Pengelola Berkas TXT / Dokumen', action: () => UI.openModal('files') },
                        { label: '🛠️ Tool Manager', action: () => UI.openModal('tools') },
                        { label: '⚙️ Buka Pengaturan (Settings)', action: () => UI.openModal('settings') },
                        { label: '💾 Backup & Restore JSON', action: () => UI.openModal('backup') },
                        { label: '📊 Status & Telemetri Debug', action: () => UI.openModal('debug') },
                        { label: '🌓 Ganti Mode Gelap / Terang', action: () => { const n = State.settings.theme === 'dark' ? 'light' : 'dark'; UI.applyTheme(n); } }
                    ];

                    const q = filterText.toLowerCase();
                    paletteCommands.filter(c => c.label.toLowerCase().includes(q)).forEach(cmd => {
                        const itm = document.createElement('div');
                        itm.className = 'cmd-palette-item';
                        itm.textContent = cmd.label;
                        itm.addEventListener('click', () => {
                            UI.closeCommandPalette();
                            cmd.action();
                        });
                        container.appendChild(itm);
                    });
                },

                bindEvents() {
                    // Send Message Action
                    const btnSend = document.getElementById('btnSendMessage');
                    const textInp = document.getElementById('userChatInput');

                    if (btnSend && textInp) {
                        btnSend.addEventListener('click', () => Agent.handleInput(textInp.value));
                        textInp.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' && !e.shiftKey && State.settings.enterToSend) {
                                e.preventDefault();
                                Agent.handleInput(textInp.value);
                            }
                        });
                        textInp.addEventListener('input', () => {
                            textInp.style.height = 'auto';
                            textInp.style.height = Math.min(textInp.scrollHeight, 150) + 'px';
                        });
                    }

                    // Voice Input Button
                    const btnVoice = document.getElementById('btnVoiceInput');
                    if (btnVoice) btnVoice.addEventListener('click', () => Speech.toggleRecognition());

                    // Manual Google Search Trigger in Input Bar
                    const btnManualG = document.getElementById('btnManualGoogleTrigger');
                    if (btnManualG && textInp) {
                        btnManualG.addEventListener('click', () => {
                            const val = textInp.value.trim();
                            if (val) {
                                bukaGoogle(val);
                                UI.toast(`Membuka Google Search untuk: "${val}"`, 'info');
                            } else {
                                UI.toast('Ketik kata kunci pencarian di kolom input.', 'warning');
                            }
                        });
                    }

                    // Top Navbar Google Search
                    const btnDirectG = document.getElementById('btnDirectGoogleSearch');
                    if (btnDirectG) {
                        btnDirectG.addEventListener('click', () => {
                            const q = prompt('Masukkan kata kunci untuk dicari di Google:');
                            if (q) bukaGoogle(q);
                        });
                    }

                    // Clear Chat
                    const btnClear = document.getElementById('btnClearChatHistory');
                    if (btnClear) {
                        btnClear.addEventListener('click', () => {
                            if (confirm('Bersihkan percakapan aktif?')) ChatEngine.clearActiveMessages();
                        });
                    }

                    // New Chat Main
                    const btnNewC = document.getElementById('btnCreateNewChat');
                    if (btnNewC) {
                        btnNewC.addEventListener('click', () => {
                            ChatEngine.createSession('Percakapan Baru');
                            UI.closeSidebarDrawer();
                        });
                    }

                    // Project Switcher
                    const btnSwitchP = document.getElementById('btnSwitchProject');
                    if (btnSwitchP) btnSwitchP.addEventListener('click', () => UI.openModal('projects'));

                    // Sidebar Tabs
                    const tabRow = document.getElementById('sidebarTabRow');
                    if (tabRow) {
                        tabRow.querySelectorAll('.nav-tab-pill').forEach(btn => {
                            btn.addEventListener('click', (e) => {
                                tabRow.querySelectorAll('.nav-tab-pill').forEach(b => b.classList.remove('active'));
                                e.target.classList.add('active');
                                State.activeSidebarTab = e.target.getAttribute('data-tab');
                                UI.renderSidebar();
                            });
                        });
                    }

                    // Sidebar Drawer Toggle Mobile
                    const btnOpenSb = document.getElementById('btnOpenSidebar');
                    const btnCloseSb = document.getElementById('btnCloseSidebar');
                    const sb = document.getElementById('appSidebar');

                    if (btnOpenSb && sb) btnOpenSb.addEventListener('click', () => sb.classList.add('drawer-open'));
                    if (btnCloseSb && sb) btnCloseSb.addEventListener('click', () => sb.classList.remove('drawer-open'));

                    // Footer Buttons
                    const btnSettings = document.getElementById('btnOpenSettings');
                    if (btnSettings) btnSettings.addEventListener('click', () => UI.openModal('settings'));

                    const btnTools = document.getElementById('btnOpenToolManager');
                    if (btnTools) btnTools.addEventListener('click', () => UI.openModal('tools'));

                    const btnBackup = document.getElementById('btnOpenBackupModal');
                    if (btnBackup) btnBackup.addEventListener('click', () => UI.openModal('backup'));

                    const btnDebug = document.getElementById('btnOpenDebugModal');
                    if (btnDebug) btnDebug.addEventListener('click', () => UI.openModal('debug'));

                    const btnTheme = document.getElementById('btnToggleTheme');
                    if (btnTheme) {
                        btnTheme.addEventListener('click', () => {
                            const next = State.settings.theme === 'dark' ? 'light' : 'dark';
                            UI.applyTheme(next);
                        });
                    }

                    // Command Palette Trigger
                    const btnCmdPal = document.getElementById('btnOpenCommandPalette');
                    if (btnCmdPal) btnCmdPal.addEventListener('click', () => UI.openCommandPalette());

                    const cmdPalInput = document.getElementById('cmdPaletteInput');
                    if (cmdPalInput) {
                        cmdPalInput.addEventListener('input', (e) => UI.renderCommandList(e.target.value));
                    }

                    const cmdPalBackdrop = document.getElementById('cmdPaletteOverlay');
                    if (cmdPalBackdrop) {
                        cmdPalBackdrop.addEventListener('click', (e) => {
                            if (e.target === cmdPalBackdrop) UI.closeCommandPalette();
                        });
                    }

                    // Keyboard Shortcuts (Ctrl+K, Esc)
                    window.addEventListener('keydown', (e) => {
                        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                            e.preventDefault();
                            UI.openCommandPalette();
                        }
                        if (e.key === 'Escape') {
                            UI.closeModal();
                            UI.closeCommandPalette();
                            UI.closeSidebarDrawer();
                        }
                    });

                    // Universal Modal Close
                    const btnCloseM = document.getElementById('btnModalCloseCross');
                    const modalBack = document.getElementById('universalModalBackdrop');
                    if (btnCloseM) btnCloseM.addEventListener('click', () => UI.closeModal());
                    if (modalBack) {
                        modalBack.addEventListener('click', (e) => {
                            if (e.target === modalBack) UI.closeModal();
                        });
                    }

                    // Quick Chips in Input
                    const chipCalc = document.getElementById('chipCalc');
                    if (chipCalc && textInp) {
                        chipCalc.addEventListener('click', () => {
                            textInp.value = '/calc sin(30) + sqrt(144) * 2';
                            textInp.focus();
                        });
                    }

                    const chipConvert = document.getElementById('chipConvert');
                    if (chipConvert && textInp) {
                        chipConvert.addEventListener('click', () => {
                            textInp.value = '100 km ke meter';
                            textInp.focus();
                        });
                    }

                    const chipTask = document.getElementById('chipTask');
                    if (chipTask && textInp) {
                        chipTask.addEventListener('click', () => {
                            textInp.value = 'Buat catatan tentang fotosintesis lalu simpan sebagai TXT';
                            textInp.focus();
                        });
                    }

                    const chipTime = document.getElementById('chipTime');
                    if (chipTime) chipTime.addEventListener('click', () => Agent.handleInput('jam berapa sekarang'));

                    const chipSearch = document.getElementById('chipSearch');
                    if (chipSearch && textInp) {
                        chipSearch.addEventListener('click', () => {
                            textInp.value = '/search berita teknologi terbaru';
                            textInp.focus();
                        });
                    }

                    // Online / Offline System Events
                    window.addEventListener('online', () => {
                        UI.updateOnlineStatus(true);
                        UI.toast('Koneksi internet terhubung.', 'success');
                    });

                    window.addEventListener('offline', () => {
                        UI.updateOnlineStatus(false);
                        UI.toast('Mode offline aktif.', 'warning');
                    });
                }
            };

            // Initialize Application
            UI.init();
        });
    </script>
</body>
</html>
