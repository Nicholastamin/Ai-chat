                    const sidebar = document.getElementById('appSidebar');
                    if (window.innerWidth <= 768 && sidebar) {
                        sidebar.classList.remove('open');
                    }
                },

                bindEvents() {
                    // Send message button
                    const btnSend = document.getElementById('btnSendMessage');
                    const chatInput = document.getElementById('userChatInput');

                    if (btnSend && chatInput) {
                        btnSend.addEventListener('click', () => {
                            AgentCore.handleUserInput(chatInput.value);
                        });

                        chatInput.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' && !e.shiftKey) {
                                e.preventDefault();
                                AgentCore.handleUserInput(chatInput.value);
                            }
                        });

                        // Auto expand textarea
                        chatInput.addEventListener('input', () => {
                            chatInput.style.height = 'auto';
                            chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + 'px';
                        });
                    }

                    // Voice button
                    const btnVoice = document.getElementById('btnVoiceInput');
                    if (btnVoice) {
                        btnVoice.addEventListener('click', () => {
                            SpeechEngine.toggleRecording();
                        });
                    }

                    // Manual Search Button
                    const btnManualSearch = document.getElementById('btnManualSearch');
                    if (btnManualSearch && chatInput) {
                        btnManualSearch.addEventListener('click', () => {
                            const q = chatInput.value.trim();
                            if (q) {
                                SearchEngine.bukaGoogle(q);
                                UI.toast(`Membuka Google Search untuk: "${q}"`, 'info');
                            } else {
                                UI.toast('Ketik kata kunci pencarian di kotak input.', 'warning');
                            }
                        });
                    }

                    // Top header buttons
                    const btnHeaderSearch = document.getElementById('btnHeaderSearch');
                    if (btnHeaderSearch && chatInput) {
                        btnHeaderSearch.addEventListener('click', () => {
                            const q = prompt('Masukkan kata kunci pencarian Google:', chatInput.value);
                            if (q) SearchEngine.bukaGoogle(q);
                        });
                    }

                    const btnHeaderClear = document.getElementById('btnHeaderClear');
                    if (btnHeaderClear) {
                        btnHeaderClear.addEventListener('click', () => {
                            if (confirm('Bersihkan percakapan pada sesi ini?')) {
                                ChatEngine.clearActiveMessages();
                            }
                        });
                    }

                    // Debug Toggle
                    const btnToggleDebug = document.getElementById('btnToggleDebug');
                    const btnCloseDebug = document.getElementById('btnCloseDebug');
                    if (btnToggleDebug) btnToggleDebug.addEventListener('click', () => UI.toggleDebugDrawer());
                    if (btnCloseDebug) btnCloseDebug.addEventListener('click', () => UI.toggleDebugDrawer());

                    // Quick Chips Toolbar
                    const chipCalc = document.getElementById('chipCalc');
                    if (chipCalc && chatInput) {
                        chipCalc.addEventListener('click', () => {
                            chatInput.value = '/calc 25*4 + sqrt(144)';
                            chatInput.focus();
                        });
                    }

                    const chipConvert = document.getElementById('chipConvert');
                    if (chipConvert && chatInput) {
                        chipConvert.addEventListener('click', () => {
                            chatInput.value = '100 km ke meter';
                            chatInput.focus();
                        });
                    }

                    const chipTime = document.getElementById('chipTime');
                    if (chipTime) {
                        chipTime.addEventListener('click', () => {
                            AgentCore.handleUserInput('jam berapa sekarang');
                        });
                    }

                    const chipLearn = document.getElementById('chipLearn');
                    if (chipLearn && chatInput) {
                        chipLearn.addEventListener('click', () => {
                            chatInput.value = 'ajari | salam | halo asisten';
                            chatInput.focus();
                        });
                    }

                    // Sidebar Actions
                    const btnNewChat = document.getElementById('btnNewChat');
                    if (btnNewChat) {
                        btnNewChat.addEventListener('click', () => {
                            ChatEngine.createSession('Percakapan Baru');
                            UI.closeSidebarMobile();
                        });
                    }

                    // Tab bar in Sidebar
                    const navTabs = document.querySelectorAll('.nav-tab-btn');
                    navTabs.forEach(tab => {
                        tab.addEventListener('click', () => {
                            navTabs.forEach(t => t.classList.remove('active'));
                            tab.classList.add('active');
                            AppState.activeNavTab = tab.getAttribute('data-tab');
                            UI.renderSidebar();
                        });
                    });

                    // Mobile Drawer Toggles
                    const btnOpenSidebar = document.getElementById('btnOpenSidebar');
                    const btnCloseSidebar = document.getElementById('btnCloseSidebar');
                    const sidebar = document.getElementById('appSidebar');

                    if (btnOpenSidebar && sidebar) {
                        btnOpenSidebar.addEventListener('click', () => sidebar.classList.add('open'));
                    }
                    if (btnCloseSidebar && sidebar) {
                        btnCloseSidebar.addEventListener('click', () => sidebar.classList.remove('open'));
                    }

                    // Footer Buttons
                    const btnTheme = document.getElementById('btnToggleTheme');
                    if (btnTheme) {
                        btnTheme.addEventListener('click', () => {
                            const newTheme = AppState.settings.theme === 'dark' ? 'light' : 'dark';
                            UI.applyTheme(newTheme);
                        });
                    }

                    const btnSettings = document.getElementById('btnOpenSettings');
                    if (btnSettings) btnSettings.addEventListener('click', () => UI.openModal('settings'));

                    const btnFiles = document.getElementById('btnOpenFiles');
                    if (btnFiles) btnFiles.addEventListener('click', () => UI.openModal('files'));

                    const btnBackup = document.getElementById('btnOpenBackup');
                    if (btnBackup) btnBackup.addEventListener('click', () => UI.openModal('backup'));

                    // Modal Close Events
                    const btnCloseModal = document.getElementById('btnCloseModal');
                    const modalOverlay = document.getElementById('appModalOverlay');
                    if (btnCloseModal) btnCloseModal.addEventListener('click', () => UI.closeModal());
                    if (modalOverlay) {
                        modalOverlay.addEventListener('click', (e) => {
                            if (e.target === modalOverlay) UI.closeModal();
                        });
                    }
                }
            };

            // Start the Application
            UI.init();
        });
    </script>
</body>
</html>
